<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bestellung erfolgreich — ARDA HAIR</title>

  <link
    rel="icon"
    type="image/png"
    href="assets/arda-favicon.png?v=2"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #fff8fa,
          #f8f1f3 55%,
          #f4eef0
        );
      color: #111;
    }

    .header {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5vw;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .logo img {
      width: 140px;
      height: auto;
      display: block;
    }

    .secure {
      background: #0a0a0a;
      color: white;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .main {
      min-height: calc(100vh - 82px);
      display: grid;
      place-items: center;
      padding: 50px 20px;
    }

    .card {
      width: min(650px, 100%);
      background: rgba(255,255,255,.96);
      border: 1px solid #eadfe3;
      border-radius: 28px;
      padding: 54px 42px;
      text-align: center;
      box-shadow:
        0 30px 80px rgba(0,0,0,.08);
    }

    .icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 26px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 700;
    }

    .kicker {
      display: block;
      margin-bottom: 12px;
      color: #c87391;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0 0 18px;
      font-family: Georgia, serif;
      font-size: clamp(38px, 6vw, 58px);
      line-height: 1.03;
    }

    .message {
      margin: 0 auto;
      max-width: 510px;
      color: #666;
      font-size: 16px;
      line-height: 1.7;
    }

    .details {
      display: none;
      margin-top: 34px;
      padding: 22px;
      border-radius: 18px;
      background: #faf7f8;
      border: 1px solid #eee2e6;
    }

    .details.show {
      display: block;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 0;
      text-align: left;
    }

    .details-row span {
      color: #777;
    }

    .details-row strong {
      text-align: right;
    }

    .actions {
      display: none;
      margin-top: 32px;
    }

    .actions.show {
      display: block;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 30px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .status-error .icon {
      background: #b3261e;
    }

    @media (max-width: 600px) {
      .header {
        padding: 0 20px;
      }

      .logo img {
        width: 115px;
      }

      .secure {
        font-size: 10px;
        padding: 9px 12px;
      }

      .card {
        padding: 40px 22px;
        border-radius: 22px;
      }

      .details-row {
        flex-direction: column;
        gap: 4px;
      }

      .details-row strong {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <a
      class="logo"
      href="index.html"
      aria-label="ARDA HAIR"
    >
      <img
        src="assets/arda-logo.png"
        alt="ARDA HAIR"
      >
    </a>

    <div class="secure">
      Sicherer Checkout
    </div>

  </header>


  <main class="main">

    <section
      class="card"
      id="successCard"
    >

      <div class="icon" id="statusIcon">
        …
      </div>

      <span class="kicker">
        ARDA HAIR
      </span>

      <h1 id="statusTitle">
        Zahlung wird geprüft
      </h1>

      <p
        class="message"
        id="statusMessage"
      >
        Einen Moment bitte. Wir bestätigen deine Zahlung sicher mit Stripe.
      </p>


      <div
        class="details"
        id="orderDetails"
      >

        <div class="details-row">
          <span>Bestellnummer</span>
          <strong id="orderNumber">—</strong>
        </div>

        <div class="details-row">
          <span>Gesamtbetrag</span>
          <strong id="orderTotal">—</strong>
        </div>

        <div class="details-row">
          <span>Status</span>
          <strong>Bezahlt</strong>
        </div>

      </div>


      <div
        class="actions"
        id="successActions"
      >

        <a
          href="index.html"
          class="button"
        >
          Zurück zum Shop
        </a>

      </div>

    </section>

  </main>


  <script>
    function formatMoney(
      cents,
      currency
    ) {

      return new Intl.NumberFormat(
        'de-DE',
        {
          style: 'currency',
          currency:
            currency || 'EUR'
        }
      ).format(
        Number(cents || 0) / 100
      );

    }


    async function verifyPayment() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const sessionId =
        params.get('session_id');


      const card =
        document.getElementById(
          'successCard'
        );

      const icon =
        document.getElementById(
          'statusIcon'
        );

      const title =
        document.getElementById(
          'statusTitle'
        );

      const message =
        document.getElementById(
          'statusMessage'
        );

      const details =
        document.getElementById(
          'orderDetails'
        );

      const actions =
        document.getElementById(
          'successActions'
        );


      if (!sessionId) {

        card.classList.add(
          'status-error'
        );

        icon.textContent = '!';

        title.textContent =
          'Zahlung konnte nicht geprüft werden';

        message.textContent =
          'Die Stripe-Sitzung fehlt. Bitte kontaktiere uns, falls du bereits bezahlt hast.';

        actions.classList.add(
          'show'
        );

        return;

      }


      try {

        const response =
          await fetch(
            '/api/verify-stripe-session?session_id=' +
            encodeURIComponent(
              sessionId
            ),
            {
              cache: 'no-store'
            }
          );


        const data =
          await response
            .json()
            .catch(() => ({}));


        if (
          !response.ok ||
          !data.ok ||
          data.paymentStatus !==
          'paid'
        ) {

          throw new Error(
            'VERIFY_FAILED'
          );

        }


        localStorage.removeItem(
          'ardaHairCart'
        );


        icon.textContent = '✓';

        title.textContent =
          'Vielen Dank!';

        message.textContent =
          'Deine Zahlung war erfolgreich und deine Bestellung wurde bestätigt.';


        document.getElementById(
          'orderNumber'
        ).textContent =
          data.order.orderNumber;


        document.getElementById(
          'orderTotal'
        ).textContent =
          formatMoney(
            data.order.totalCents,
            data.order.currency
          );


        details.classList.add(
          'show'
        );

        actions.classList.add(
          'show'
        );


      } catch (error) {

        card.classList.add(
          'status-error'
        );

        icon.textContent = '!';

        title.textContent =
          'Bestätigung noch nicht verfügbar';

        message.textContent =
          'Die Zahlung konnte gerade nicht sicher bestätigt werden. Bitte bezahle nicht erneut. Lade diese Seite in wenigen Sekunden neu.';

        actions.classList.add(
          'show'
        );

      }

    }


    verifyPayment();
  </script>

</body>
</html>
