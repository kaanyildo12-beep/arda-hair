<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARDA HAIR — Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="../">ARDA HAIR</a><span>ADMIN</span><button id="logout" hidden>Abmelden</button></header><main><section id="login" class="panel"><h1>Admin Panel</h1><form id="loginForm"><label>E-Mail<input id="email" type="email" required value="kaanyildo12@gmail.com"></label><label>Passwort<input id="password" type="password" required></label><button type="submit">Anmelden</button><button type="button" id="signup" class="secondary">Erstes Admin-Konto erstellen</button><p id="loginMsg"></p></form></section><section id="dashboard" hidden><div class="title"><h1>Produkte verwalten</h1><button id="newProduct">+ Neues Produkt</button></div><div id="products"></div></section></main><dialog id="editor"><form id="productForm"><button type="button" id="closeEditor">×</button><input id="productId" type="hidden"><label>Slug<input id="slug" required></label><label>Preis (€)<input id="price" type="number" min="0" step="0.01" required></label><label>Bestand<input id="stock" type="number" min="0" value="0"></label><label>Kategorie<input id="category"></label><label>Farbe<input id="color"></label><label>Textur<input id="texture"></label><label>Länge (cm)<input id="length" type="number" min="1"></label><label>Gewicht (g)<input id="weight" type="number" min="1"></label><h3>Deutsch</h3><label>Name<input id="nameDe" required></label><label>Beschreibung<textarea id="descDe"></textarea></label><h3>Türkçe</h3><label>Ürün adı<input id="nameTr"></label><label>Açıklama<textarea id="descTr"></textarea></label><h3>English</h3><label>Product name<input id="nameEn"></label><label>Description<textarea id="descEn"></textarea></label><label><input id="active" type="checkbox"> Veröffentlicht</label><label><input id="featured" type="checkbox"> Hervorgehoben</label><label>Foto / Video<input id="media" type="file" accept="image/jpeg,image/png,image/webp,image/avif,video/mp4,video/webm"></label><div class="actions"><button type="button" id="deleteProduct" class="danger">Löschen</button><button type="submit">Speichern</button></div><p id="editorMsg"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
