    .legal-card p {
      margin: 0;
      line-height: 1.8;
      color: #333;
    }

    .legal-card a {
      color: #b75f7c;
      font-weight: 600;
      text-decoration: none;

    .legal-card a:hover {

    .legal-footer {

        padding: 0 18px;
